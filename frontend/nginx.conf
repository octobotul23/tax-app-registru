server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Receipt photographs go up from phone cameras; the default 1 MB would
    # reject most of them.
    client_max_body_size 32m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed asset filenames are safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A vision model on CPU can take minutes. Do not cut it off.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Single-page app: every unknown path is a client-side route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
